name: eh-authnet
on:
    push:
    pull_request:
    workflow_dispatch:
env:
    sdk_python: 'sdk-python'
    sample_code_python: 'sample-code-python'
jobs:
    workflow-job:
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                operating-system: [ubuntu-latest]
                pyth-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
        runs-on: ubuntu-latest
        steps:
            - name: Creating separate folders for SDK and Sample Codes
              run: |
                rm -rf $sdk_python
                rm -rf $sample_code_python
                mkdir $sdk_python $sample_code_python

            - name: Checkout authorizenet/sdk-python
              uses: actions/checkout@v4
              with:
                  path: ${{env.sdk_python}}

            - name: Checkout authorizenet/sample-code-python
              uses: actions/checkout@v4
              with:
                repository: 'authorizenet/sample-code-python'
                ref: 'master'
                path: ${{env.sample_code_python}}

            - name: Install Python
              uses: actions/setup-python@v5
              with:
                python-version: ${{matrix.pyth-version}}

            - name: Install and Test
              run: |
                python -V
                python -m pip install --upgrade pip
                python -m venv virtual_env
                if [[ "$(uname -s)" == "Linux" ]]; then
                    echo "OS: Linux"
                    source virtual_env/bin/activate
                elif [[ "$(uname -s)" == "Darwin" ]]; then
                    echo "OS: MacOS"
                    source virtual_env/bin/activate
                else
                    echo "OS: Windows"
                    source virtual_env/Scripts/activate
                fi
                echo $VIRTUAL_ENV
                
                cd $sdk_python
                pip install -e .

                cd ../$sample_code_python
                python ./test-runner.py
    pypi-publish:
      name: upload release to PyPI
      runs-on: ubuntu-latest
      # Specifying a GitHub environment is optional, but strongly encouraged
      environment: pypi
      permissions:
        # IMPORTANT: this permission is mandatory for Trusted Publishing
        id-token: write
      steps:
        # retrieve your distributions here

        - name: Publish package distributions to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1